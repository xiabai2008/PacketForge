[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packetforge"
version = "0.1.0"
description = "AI network analysis tool library + MCP server for authorized penetration testing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PacketForge contributors" }]
keywords = ["wireshark", "tshark", "nmap", "pcap", "mcp", "penetration-testing", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
]

[project.urls]
Repository = "https://github.com/xiabai2008/PacketForge"
Issues = "https://github.com/xiabai2008/PacketForge/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["packetforge*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=packetforge --cov-report=term-missing"

[tool.ruff.lint]
# Intentional per design doc: tool layer catches all exceptions to produce
# audited error envelopes (BLE001); subprocess return codes are checked
# manually (PLW1510); base64 decode failures are skipped silently (S112).
ignore = ["BLE001", "PLW1510", "S112"]
